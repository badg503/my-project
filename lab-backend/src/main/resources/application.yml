server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/lab_management?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    user:
      name: admin
      password: 123456

jwt:
  secret: lab_management_system_secret_key_2024
  expiration: 10800000  # 3 小时（10800000 毫秒）
  header: Authorization
  prefix: Bearer

