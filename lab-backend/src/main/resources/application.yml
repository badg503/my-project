mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lab.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ai:
  enabled: true
  base-url: http://localhost:5000
  qa-endpoint: /ai/qa
  fault-predict-endpoint: /ai/fault-predict
  safety-detect-endpoint: /ai/safety-detect
  schedule-endpoint: /ai/schedule
  analysis-endpoint: /ai/analysis
  timeout-ms: 10000

logging:
  level:
    org.springframework.security: DEBUG

# 邮箱配置（找回密码功能）
